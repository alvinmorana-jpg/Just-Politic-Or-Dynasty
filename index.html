<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#c0392b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta property="og:image" content="assets/logo.png">
    <title>Province Governor – Philippines</title>
    <script src="js/core/device.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/boot.css">

    <link rel="stylesheet" href="css/neighbours.css">
    <link rel="stylesheet" href="css/rotate-guard.css">
</head>

<body>
    <div id="boot" role="status" aria-live="polite">
        <div class="bt"><img class="logo" src="assets/logo.png" alt="President or Rebel – Beta Version" width="256" height="256">
            <h1 class="sr">Province Governor</h1>
            <div class="ov">Philippines · Malaysia</div>
            <div class="bl2"><i id="bpi"></i></div>
            <div id="bst">Starting up…</div><small id="btip"></small>
        </div>
    </div>
    <div id="app" inert>
        <div id="mapbox"><svg id="map" viewBox="0 0 100 100"></svg>
            <div id="night"></div>
            <div id="zc"><button id="zi">+</button><button id="zo">−</button><button id="zr">⟲</button></div>
            <div id="lg"><span>Low</span><i></i><span>High dev</span></div>
        </div>
        <div id="side"></div>
    </div>
    <div id="toast"></div>
<div id="rotateGuard" role="alert">
    <div class="ico">📱</div>
    <b>Please rotate your phone</b>
    <span>This game plays in landscape (horizontal) mode. Turn your phone sideways to continue.</span>
</div>
