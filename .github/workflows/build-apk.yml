name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node tools/check-modules.js
      - run: npx cap add android
        if: ${{ hashFiles('android/gradlew') == '' }}
      - name: Generate app icons (optional)
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ProvinceGovernor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Province Governor build ${{ github.run_number }}
          files: ProvinceGovernor.apk
